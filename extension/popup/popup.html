<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Protector de Datos Personales</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    <header class="popup-header">
      <div class="popup-header-left">
        <div class="shield-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z" fill="var(--header-bg)"/>
            <path d="M9 12l2 2 4-4" stroke="var(--switch-active)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h2 class="header-title" id="estado-label">Privacidad activa</h2>
          <p class="header-sub">detector de datos personales</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <div class="popup-body">
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-num" id="statHoy">—</div>
          <div class="stat-label">
            <span class="stat-dot" style="background: var(--switch-active)"></span>avisos hoy
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-split">
            <div>
              <div class="stat-num">7</div>
              <div class="stat-label">
                <span class="stat-dot" style="background: var(--accent-blue)"></span>esta semana
              </div>
            </div>
            <div class="activity-bar" aria-hidden="true">
              <div class="bar-col" style="height:30%"></div>
              <div class="bar-col" style="height:60%"></div>
              <div class="bar-col" style="height:40%"></div>
              <div class="bar-col active-bar" style="height:80%"></div>
              <div class="bar-col" style="height:55%"></div>
              <div class="bar-col active-bar" style="height:100%"></div>
              <div class="bar-col active-bar" style="height:70%"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="section-label">tipos de datos</p>
      <div class="tags-row">
        <label class="tag-label">
          <input type="checkbox" id="tp-correo" checked>
          <span class="tag-custom"><span class="tag-dot"></span>correo</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-nombre" checked>
          <span class="tag-custom"><span class="tag-dot"></span>nombre</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-tarjeta" checked>
          <span class="tag-custom"><span class="tag-dot"></span>tarjeta</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-dni" checked>
          <span class="tag-custom"><span class="tag-dot"></span>dni</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-edad" checked>
          <span class="tag-custom"><span class="tag-dot"></span>edad</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-ubicacion" checked>
          <span class="tag-custom"><span class="tag-dot"></span>ubicación</span>
        </label>
        <label class="tag-label">
          <input type="checkbox" id="tp-enlace" checked>
          <span class="tag-custom"><span class="tag-dot"></span>enlace sospechoso</span>
        </label>
      </div>

      <p class="section-label">sitios protegidos</p>
      <div class="sites-grid">
        <label class="site-card-label">
          <input type="checkbox" id="pg-steam" checked>
          <div class="site-btn">
            <div class="site-icon" style="background:#171a21; color:#c6d4df;">St</div>
            <span>Steam</span>
            <div class="site-check">
              <svg width="8" height="6" viewBox="0 0 8 6" fill="none"><path d="M1 3l2 2 4-4" stroke="var(--header-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </label>
        <label class="site-card-label">
          <input type="checkbox" id="pg-roblox" checked>
          <div class="site-btn">
            <div class="site-icon" style="background:#e13b3b; color:#fff;">Rb</div>
            <span>Roblox</span>
            <div class="site-check">
              <svg width="8" height="6" viewBox="0 0 8 6" fill="none"><path d="M1 3l2 2 4-4" stroke="var(--header-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </label>
        <label class="site-card-label">
          <input type="checkbox" id="pg-epic" checked>
          <div class="site-btn">
            <div class="site-icon" style="background:#0078f2; color:#fff;">Ep</div>
            <span>Epic Games</span>
            <div class="site-check">
              <svg width="8" height="6" viewBox="0 0 8 6" fill="none"><path d="M1 3l2 2 4-4" stroke="var(--header-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </label>
        <label class="site-card-label">
          <input type="checkbox" id="pg-discord" checked>
          <div class="site-btn">
            <div class="site-icon" style="background:#5865f2; color:#fff;">Dc</div>
            <span>Discord</span>
            <div class="site-check">
              <svg width="8" height="6" viewBox="0 0 8 6" fill="none"><path d="M1 3l2 2 4-4" stroke="var(--header-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </label>
      </div>

      <div class="config-grid">
        <div class="select-box">
          <span class="select-title">Ubicación alertas</span>
          <div class="select-wrapper">
            <select id="posicion-alerta">
              <option value="bottom-right">Abajo derecha</option>
              <option value="bottom-left">Abajo izquierda</option>
              <option value="top-right">Arriba derecha</option>
              <option value="top-left">Arriba izquierda</option>
            </select>
          </div>
        </div>
        <div class="select-box">
          <span class="select-title">Tema interfaz</span>
          <div class="select-wrapper">
            <select id="theme-select">
              <option value="system">Automático</option>
              <option value="light">Claro</option>
              <option value="dark">Oscuro</option>
            </select>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="bottom-row">
        <button id="historial" class="btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          historial
        </button>
        <button id="guia" class="btn-accent">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          ver guía
        </button>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
