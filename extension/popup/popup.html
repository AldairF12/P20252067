<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cyber Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    <header class="popup-header glass-card highlight-border interactive-card">
      <h1 class="main-title">CYBER SHIELD</h1>
      <div class="switch-container">
        <label for="toggle" id="estado-label">Privacidad Activa</label>
        <label class="switch cyber-switch">
          <input type="checkbox" id="toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <div class="popup-body">
      <!-- Estadísticas -->
      <div class="stats-row">
        <div class="stat-card glass-card stat-hoy interactive-card">
          <div class="stat-num neon-cyan" id="statHoy">0</div>
          <div class="stat-label">Avisos Hoy</div>
        </div>
        <div class="stat-card glass-card activity-card interactive-card">
          <div class="stat-text-col">
            <div class="stat-num neon-magenta" id="statSemana">0</div>
            <div class="stat-label">Esta Semana</div>
          </div>
          <div class="activity-bar" id="graficoSemana" aria-hidden="true">
            <!-- JS injectará 7 barras aquí -->
          </div>
        </div>
      </div>

      <!-- Tipos de datos protegidos -->
      <div class="section-card glass-card interactive-card">
        <h3 class="section-title">Tipos de Datos</h3>
        <div class="tags-grid">
          <label class="tag-toggle"><input type="checkbox" id="tp-correo" checked><span class="tag-body">Correo</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-nombre" checked><span class="tag-body">Nombre</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-tarjeta" checked><span class="tag-body">Tarjeta</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-dni" checked><span class="tag-body">DNI</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-celular" checked><span class="tag-body">Celular</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-edad" checked><span class="tag-body">Edad</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-ubicacion" checked><span class="tag-body">Ubicación</span></label>
          <label class="tag-toggle"><input type="checkbox" id="tp-enlace" checked><span class="tag-body">Enlaces</span></label>
        </div>
      </div>

      <div class="stats-row" style="grid-template-columns: 1.2fr 1fr;">
        <!-- Sitios protegidos -->
        <div class="section-card glass-card interactive-card" style="padding: 10px;">
          <h3 class="section-title">Sitios</h3>
          <div class="sites-grid-compact">
            <label class="site-toggle"><input type="checkbox" id="pg-steam" checked><div class="site-body"><img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam" width="16"></div></label>
            <label class="site-toggle"><input type="checkbox" id="pg-roblox" checked><div class="site-body"><img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Roblox_Logo_2025.png" alt="Roblox" width="16"></div></label>
            <label class="site-toggle"><input type="checkbox" id="pg-epic" checked><div class="site-body"><img src="https://www.svgrepo.com/show/341792/epic-games.svg" alt="Epic" width="16"></div></label>
            <label class="site-toggle"><input type="checkbox" id="pg-discord" checked><div class="site-body"><img src="https://www.svgrepo.com/show/331368/discord-v2.svg" alt="Discord" width="16"></div></label>
          </div>
        </div>

        <!-- Ajustes de interfaz rápidos -->
        <div class="section-card glass-card interactive-card settings-mini" style="padding: 10px; display: flex; flex-direction: column; justify-content: space-between;">
          <div class="setting-item">
            <span class="setting-label">Tema Visual</span>
            <div class="theme-buttons">
              <button class="theme-btn" data-theme="system" title="Auto">A</button>
              <button class="theme-btn" data-theme="dark" title="Oscuro">O</button>
              <button class="theme-btn" data-theme="light" title="Claro">C</button>
            </div>
          </div>
          <div class="setting-item" style="margin:0;">
            <span class="setting-label">Compacto</span>
            <label class="switch-small cyber-switch">
              <input type="checkbox" id="tp-compacto">
              <span class="slider-small"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Selector de Ubicación Visual -->
      <div class="section-card glass-card interactive-card location-card">
        <div class="location-info">
          <h3 class="section-title" style="margin-bottom: 2px;">Ubicación de Alertas</h3>
          <select class="cyber-select" id="posicion-alerta-select" style="margin-top: 5px; font-size: 11px; padding: 4px 6px;">
            <option value="bottom-right">Abajo derecha</option>
            <option value="bottom-left">Abajo izquierda</option>
            <option value="top-right">Arriba derecha</option>
            <option value="top-left">Arriba izquierda</option>
          </select>
        </div>
        <div class="location-screen">
          <div class="screen-frame">
            <div class="screen-inner">
              <div class="loc-corner loc-tl" data-pos="top-left"></div>
              <div class="loc-corner loc-tr" data-pos="top-right"></div>
              <div class="loc-corner loc-bl" data-pos="bottom-left"></div>
              <div class="loc-corner loc-br" data-pos="bottom-right"></div>
              <!-- La alerta simulada que se moverá -->
              <div class="loc-alert-sim" id="loc-alert-sim"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="bottom-actions">
        <button id="historial" class="action-btn outline-btn interactive-card">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Abrir historial
        </button>
        <button id="guia" class="action-btn glow-btn interactive-card">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          Ver guía inicial
        </button>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
